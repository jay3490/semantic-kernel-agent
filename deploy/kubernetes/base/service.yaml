apiVersion: v1
kind: Service
metadata:
  name: devops-agent
  namespace: devops-agent
spec:
  selector:
    app.kubernetes.io/component: api
  # Sessions are stored per replica, so a client keeps talking to the same pod.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 80
      targetPort: http
