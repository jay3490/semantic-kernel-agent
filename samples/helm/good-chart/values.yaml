replicaCount: 2

image:
  repository: ghcr.io/example/orders-api
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: Logging__LogLevel__Default
    value: Information

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
